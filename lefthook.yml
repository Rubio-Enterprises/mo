# Git hooks, run by lefthook; installed by `just setup`.
# Checks come from the org base image (/opt/standards).
extends:
  - /opt/standards/lefthook/standards.yml
  - lefthook.override.yml

pre-commit:
  # This repository's own checks go here as more jobs, under names the shared file does not use.
  jobs:
    # lefthook skips a missing extends file without a word, so check that the package is there.
    - name: standards installed
      tags: [standards]
      run: test -f /opt/standards/lefthook/standards.yml
      fail_text: "run this inside the dev image: just check"
    # The frontend (upstream's internal/frontend/) is formatted by Oxfmt and linted by Oxlint with
    # upstream's configs; upstream formats only its src/, never the config files.
    - name: repo-oxfmt
      root: internal/frontend/
      run: pnpm exec oxfmt -c .oxfmtrc.json --check src/
    - name: repo-gostyle
      run: go vet -vettool="$(mise which gostyle)" -gostyle.config="$(pwd)/.gostyle.yml" ./...
    - name: repo-oxlint
      root: internal/frontend/
      run: pnpm exec oxlint -c .oxlintrc.json --disable-nested-config src/

commit-msg:
  jobs:
    - name: standards installed
      tags: [standards]
      run: test -f /opt/standards/lefthook/standards.yml
      fail_text: "run this inside the dev image: just check"
