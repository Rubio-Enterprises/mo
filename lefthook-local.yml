# Overlay on the shared hook registry (standards config/lefthook/README.md).
# Forks never stage Fixer rewrites.
pre-commit:
  # Repository-scope Fixer overlay.
  # Upstream formats only the nested frontend's src/, never its config files.
  # Oxfmt owns JSON inside src/; Biome owns JSON everywhere else.
  jobs:
    - name: fixers
      group:
        jobs:
          - name: repo-scope
            group:
              jobs:
                - name: biome
                  group:
                    jobs:
                      - name: invoke
                        exclude:
                          - internal/frontend/src/*.json
                - name: repo-oxfmt
                  glob: internal/frontend/src/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,css,scss,json,md,mdx,html,yaml,yml}
                  run:
                    mise exec -- pnpm --dir internal/frontend exec sh -c 'cd ../..; exec
                    oxfmt -c internal/frontend/.oxfmtrc.json --write "$@"' -- {staged_files}
          - name: stage
            stage_fixed: false
  parallel: false
  commands:
    repo-oxlint:
      glob: "internal/frontend/src/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      root: internal/frontend/
      run: mise exec -- pnpm exec oxlint -c .oxlintrc.json --disable-nested-config {staged_files}
