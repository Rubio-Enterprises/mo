# @generated by rubio-standards. DO NOT EDIT: rebuilt from the org lint rules + treefmt.toml.local.
# Repo-specific changes: edit treefmt.toml.local, then run `mise run lint-config`.
# CI fails if this file doesn't match that rebuild.

# Upstream formats only the nested frontend's src/, never its config files.
tree-root-file = "treefmt.toml"
on-unmatched = "debug"
# treefmt 2.6 uses gobwas globs WITHOUT separator arguments: * spans /, but
# **/ requires a slash. Brace prefixes cover root AND nested lockfiles without
# overmatching e.g. my-pnpm-lock.yaml. These exclusions also cover absolute args
# after treefmt resolves them relative to the root.
excludes = ["{,**/}pnpm-lock.yaml", "{,**/}package-lock.json", "{,**/}yarn.lock", "{,**/}uv.lock", "{,**/}Cargo.lock", "{,**/}poetry.lock", "{,**/}mise.lock", "{,**/}modify_*", "*.tmpl", ".github/actions/**/action.yml", ".copier-answers.yml"]

[formatter.markdownlint]
command = "mise"
options = ["exec", "--", "markdownlint-cli2", "--fix"]
includes = ["*.md"]

[formatter.yaml-prettier]
command = "mise"
options = ["exec", "--", "prettier", "--write"]
includes = ["*.yml", "*.yaml"]

[formatter.shfmt]
command = "mise"
options = ["exec", "--", "shfmt", "-w"]
includes = ["*.sh", "*.bash"]

# Oxfmt owns JSON inside src/; Biome owns JSON everywhere else.
[formatter.biome]
command = "mise"
options = ["exec", "--", "biome", "check", "--write", "--use-editorconfig=true", "--no-errors-on-unmatched"]
includes = ["*.json", "*.jsonc"]
excludes = ["internal/frontend/src/*.json"]

[formatter.tombi]
command = "mise"
options = ["exec", "--", "tombi", "format"]
includes = ["*.toml"]

[formatter.gofmt]
command = "mise"
options = ["exec", "--", "gofmt", "-w"]
includes = ["*.go"]

[formatter.repo-oxfmt]
command = "mise"
options = ["exec", "--", "pnpm", "--dir", "internal/frontend", "exec", "sh", "-c", "cd ../..; exec oxfmt -c internal/frontend/.oxfmtrc.json --write \"$@\"", "--"]
includes = ["internal/frontend/src/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,css,scss,json,md,mdx,html,yaml,yml}"]
