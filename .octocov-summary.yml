timeout: 2min
coverage:
  paths:
    - reports/coverage/go.out
    - reports/coverage/frontend/lcov.info
codeToTestRatio:
  code:
    - "**/*.go"
    - "!**/*_test.go"
    - "internal/frontend/src/**/*.ts"
    - "internal/frontend/src/**/*.tsx"
    - "!internal/frontend/src/**/*.test.ts"
    - "!internal/frontend/src/**/*.test.tsx"
    - "!internal/frontend/node_modules/**"
  test:
    - "**/*_test.go"
    - "internal/frontend/src/**/*.test.ts"
    - "internal/frontend/src/**/*.test.tsx"
    - "!internal/frontend/node_modules/**"
testExecutionTime:
  if: false
