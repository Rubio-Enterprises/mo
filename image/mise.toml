# Repository toolchain pins only, installed by Dockerfile
# Check tools are supplied by base at /opt/standards
[tools]
node = "24.22.3"
go = "1.27.4"
# Built from source with the Go pinned above: the released binary cannot check a newer Go standard library.
"go:github.com/k1LoW/gostyle" = "0.26.2"
"aqua:k1LoW/octocov" = "0.83.5"
# pnpm backs the frontend tasks; its lockfile lives in internal/frontend/.
"npm:pnpm" = "11.28.13"

# The frontend lives in internal/frontend/ (upstream's layout), the browser tests in e2e/.
