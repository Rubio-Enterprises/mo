# The default 30sec leaves no room for the step lookup's retries (test.yml runs the report in
# its own job), and running out of time skips the pull request comment.
timeout: 2min
coverage:
  paths:
    - coverage.out
    - internal/frontend/coverage/lcov.info
codeToTestRatio:
  code:
    - "**/*.go"
    - "!**/*_test.go"
    - "internal/frontend/src/**/*.ts"
    - "internal/frontend/src/**/*.tsx"
    - "!internal/frontend/src/**/*.test.ts"
    - "!internal/frontend/src/**/*.test.tsx"
    - "!internal/frontend/node_modules/**"
  test:
    - "**/*_test.go"
    - "internal/frontend/src/**/*.test.ts"
    - "internal/frontend/src/**/*.test.tsx"
    - "!internal/frontend/node_modules/**"
testExecutionTime:
  if: true
  # The report runs in its own job, so name the step to time (see .github/workflows/test.yml).
  steps:
    - Run tests (Linux)
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
