services:
  dev:
    build:
      context: .
      target: dev
      secrets:
        - GITHUB_TOKEN
    pull_policy: missing
    working_dir: ${REPO_DIR}
    init: true
    command: sleep infinity
    environment:
      - BASE_SHA
      - GH_TOKEN
      - LEFTHOOK
      - RUBIO_VOLUME_DIRS=${REPO_DIR}/.venv:${REPO_DIR}/node_modules:/home/vscode/.cache/uv:/home/vscode/.cache/npm:/home/vscode/.cache/gomod:/home/vscode/.cache/cargo/registry:/home/vscode/.cache/coursier:${REPO_DIR}/internal/frontend/node_modules:${REPO_DIR}/e2e/node_modules
    volumes:
      - type: bind
        source: ${REPO_DIR}
        target: ${REPO_DIR}
      - type: bind
        source: ${RUBIO_GIT_COMMON_DIR:-${GIT_COMMON_DIR}}
        target: ${RUBIO_GIT_COMMON_DIR:-${GIT_COMMON_DIR}}
      - type: volume
        source: venv
        target: ${REPO_DIR}/.venv
      - type: volume
        source: node_modules
        target: ${REPO_DIR}/node_modules
      - type: volume
        source: rubio-uv-cache
        target: /home/vscode/.cache/uv
      - type: volume
        source: rubio-npm-cache
        target: /home/vscode/.cache/npm
      - type: volume
        source: rubio-gomod-cache
        target: /home/vscode/.cache/gomod
      - type: volume
        source: rubio-cargo-registry
        target: /home/vscode/.cache/cargo/registry
      - type: volume
        source: rubio-coursier-cache
        target: /home/vscode/.cache/coursier
      - type: volume
        source: deps-6c34a57405d5
        target: ${REPO_DIR}/internal/frontend/node_modules
      - type: volume
        source: deps-56676763b36f
        target: ${REPO_DIR}/e2e/node_modules
volumes:
  venv: null
  node_modules: null
  rubio-uv-cache:
    external: true
  rubio-npm-cache:
    external: true
  rubio-gomod-cache:
    external: true
  rubio-cargo-registry:
    external: true
  rubio-coursier-cache:
    external: true
  deps-6c34a57405d5: null
  deps-56676763b36f: null

secrets:
  GITHUB_TOKEN:
    environment: RUBIO_BUILD_GITHUB_TOKEN
