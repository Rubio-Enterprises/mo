timeout: 2min
coverage:
  paths:
    - gate-go.out
    - gate-lcov.info
codeToTestRatio:
  code:
    - "**/*.go"
    - "!**/*_test.go"
    - "internal/frontend/src/**/*.ts"
    - "internal/frontend/src/**/*.tsx"
    - "!internal/frontend/src/**/*.test.ts"
    - "!internal/frontend/src/**/*.test.tsx"
  test:
    - "**/*_test.go"
    - "internal/frontend/src/**/*.test.ts"
    - "internal/frontend/src/**/*.test.tsx"
testExecutionTime:
  if: false
diff:
  if: false
comment:
  if: false
summary:
  if: false
report:
  path: metrics.json
