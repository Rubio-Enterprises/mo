name: license scan
# This repo-owned path replaces the manually disabled upstream trivy.yml.
# A new workflow path registers active while preserving its license policy scan.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  job-trivy:
    name: Run trivy for license check
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: internal/frontend/package.json

      # Trivy resolves Go licenses from the module cache and pnpm licenses from
      # installed packages; lockfiles alone produce a green but empty scan.
      - name: Materialize dependency license metadata
        run: |
          go mod download
          pnpm --dir internal/frontend install --frozen-lockfile

      - name: Run trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: "fs"
          scanners: "license"
          target: "."
          format: "table"
          exit-code: "1"
          severity: "UNKNOWN,MEDIUM,HIGH"
