name: lint-format
"on":
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  lint-format:
    name: lint-format
    runs-on: ${{ fromJSON(vars.RUNNER_GLUE || '["ubuntu-latest"]') }}
    env:
      RUBIO_CHANGED_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - id: lint
        name: Check Go and changed frontend source with Oxlint
        run: |
          set -euo pipefail
          mise run lint
          echo 'lint_ran=true' >> "$GITHUB_OUTPUT"
      - id: format
        name: Check changed frontend source with Oxfmt
        run: |
          set -euo pipefail
          mise run format
          echo 'format_ran=true' >> "$GITHUB_OUTPUT"
      - id: verify
        name: Require successful lint and format execution
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.lint.outputs.lint_ran }}" = true
          test "${{ steps.format.outcome }}" = success
          test "${{ steps.format.outputs.format_ran }}" = true
