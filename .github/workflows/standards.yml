name: standards
# `on:` is quoted to satisfy `yaml[truthy]` (yamllint + ansible-lint): without
# quotes, YAML 1.1 parsers fold `on` into the boolean `On`. GitHub Actions
# resolves the key by name regardless, and actionlint accepts both forms.
#
# The org's required governance workflows own audit, lint/format, secret-scan,
# PR title, and typecheck; test-gate.yml owns canonical non-E2E tests. This
# workflow keeps the scheduled trufflehog scan, repo-local lint-hooks and E2E,
# and default-branch cache seeding.
"on":
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    # `0 9 * * 1` → weekly trufflehog (secret-scan tree-wide entropy scan).
    - cron: "0 9 * * 1"
  # Manual trigger for incident-response re-runs of trufflehog.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Supersede an in-flight run of THIS workflow when a newer commit lands on the
  # same PR, so stale CI stops burning runner minutes. `github.workflow`
  # namespaces the group to standards.yml, so it never cancels the repo's other
  # workflows. cancel-in-progress is gated to pull_request so it NEVER cancels a
  # push-to-default-branch, tag, or schedule run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The 120-minute fleet floor bounds execution on a wedged self-hosted runner
  # (mac-dev-playbook#917); it never bounds queue time. The measured org-wide
  # maximum executing job is 47 minutes, and any tighter per-class value is
  # deliberate. Reusable callers cannot set timeout-minutes; the called
  # Rubio-Enterprises/.github workflows own the ceiling on their actual jobs.
  trufflehog:
    # schedule = weekly automated; workflow_dispatch = manual re-trigger for
    # incident response. Scope to trufflehog's OWN weekly cron so no other
    # schedule event fires a redundant run.
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1'
      || github.event_name == 'workflow_dispatch'
    uses: Rubio-Enterprises/.github/.github/workflows/secret-scan.yml@1eacdb6cd157fa224eeadaa710651c27e52d3063 # v4
    with: { mode: trufflehog }

  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push'
    permissions:
      contents: read
      checks: write
    uses: Rubio-Enterprises/.github/.github/workflows/e2e.yml@1eacdb6cd157fa224eeadaa710651c27e52d3063 # v4

  lint-hooks:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: Rubio-Enterprises/.github/.github/workflows/lint-hooks.yml@1eacdb6cd157fa224eeadaa710651c27e52d3063 # v4
    # secrets: inherit — the reusable workflow's private-Go-module mint step
    # (consumers setting GO_PRIVATE_MODULE_REPOS) reads the org secrets
    # STANDARDS_READER_APP_ID / STANDARDS_READER_APP_PRIVATE_KEY; a called
    # workflow receives no caller secrets unless inherited (surfaced by
    # gha-outrunner, the first GO_PRIVATE_MODULE_REPOS consumer, on .github
    # release 90eb7c68).
    secrets: inherit

  cache-seed:
    # Warms this repo's pnpm store + turbo task caches on the default branch,
    # for the injected `typecheck-ts (gate)` to read on every later PR.
    #
    # It has to run from here, and it has to run on push. GitHub scopes a cache
    # written on a PR ref to that PR alone, so the gate cannot warm anything for
    # its successors — and being an injected Required Governance Workflow, it
    # only ever fires on `pull_request` and can never reach a push event by
    # itself. What a PR run CAN always read is the default branch's caches. So
    # the default branch writes and every PR reads.
    #
    # This calls the gate's OWN workflow file with `seed-caches: true` rather
    # than a purpose-built seeder, so the cache keys have exactly one
    # definition. A seeder that drifted from the gate's key format would keep
    # passing while quietly writing caches nothing ever reads.
    #
    # Rendered wherever `gate_typescript` is (has_typescript and
    # enforce_typecheck), so the seeder exists precisely where the gate does.
    if: github.event_name == 'push'
    uses: Rubio-Enterprises/.github/.github/workflows/typecheck-ts.yml@1eacdb6cd157fa224eeadaa710651c27e52d3063 # v4
    with: { seed-caches: true }
