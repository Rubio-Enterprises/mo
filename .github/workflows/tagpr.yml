name: release

on:
  push:
    tags:
      - "strubio-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            ext: zip
          - goos: darwin
            goarch: amd64
            ext: zip
          - goos: linux
            goarch: arm64
            ext: tar.gz
          - goos: linux
            goarch: amd64
            ext: tar.gz
    steps:
      - name: Check out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: internal/frontend/package.json

      - name: Generate frontend assets
        run: go generate ./internal/static/

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          go build -ldflags "-s -w -X github.com/k1LoW/mo/version.Revision=$COMMIT" \
            -trimpath -o mo .

      - name: Package
        run: |
          ARCHIVE="mo_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip "${ARCHIVE}.zip" mo LICENSE
          else
            tar czf "${ARCHIVE}.tar.gz" mo LICENSE
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: mo_*.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Update Homebrew formula
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#strubio-v}"
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          SHA_DARWIN_ARM64=$(sha256sum mo_${TAG}_darwin_arm64.zip | cut -d' ' -f1)
          SHA_DARWIN_AMD64=$(sha256sum mo_${TAG}_darwin_amd64.zip | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum mo_${TAG}_linux_arm64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(sha256sum mo_${TAG}_linux_amd64.tar.gz | cut -d' ' -f1)

          cat > /tmp/mo.rb << FORMULA
          class Mo < Formula
            desc "Markdown viewer that opens .md files in a browser"
            homepage "https://github.com/strubio-ray/mo"
            version "$VERSION"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "$BASE_URL/mo_${TAG}_darwin_arm64.zip"
                sha256 "$SHA_DARWIN_ARM64"
              end
              if Hardware::CPU.intel?
                url "$BASE_URL/mo_${TAG}_darwin_amd64.zip"
                sha256 "$SHA_DARWIN_AMD64"
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "$BASE_URL/mo_${TAG}_linux_arm64.tar.gz"
                sha256 "$SHA_LINUX_ARM64"
              end
              if Hardware::CPU.intel?
                url "$BASE_URL/mo_${TAG}_linux_amd64.tar.gz"
                sha256 "$SHA_LINUX_AMD64"
              end
            end

            def install
              bin.install "mo"
              generate_completions_from_executable(bin/"mo", "completion")
            end

            test do
              assert_match "mo version", shell_output("#{bin}/mo --version")
            end
          end
          FORMULA

          # Remove heredoc indentation
          sed -i 's/^          //' /tmp/mo.rb

          gh api repos/strubio-ray/homebrew-tap/contents/Formula/mo.rb \
            --method PUT \
            --field message="feat: bump mo to $TAG" \
            --field content="$(base64 -w0 /tmp/mo.rb)" \
            --field sha="$(gh api repos/strubio-ray/homebrew-tap/contents/Formula/mo.rb --jq '.sha')" \
            --header "Authorization: token $COMMITTER_TOKEN"
