name: release

on:
  push:
    tags:
      - "strubio-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            ext: zip
          - goos: darwin
            goarch: amd64
            ext: zip
          - goos: linux
            goarch: arm64
            ext: tar.gz
          - goos: linux
            goarch: amd64
            ext: tar.gz
    steps:
      - name: Check out source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: internal/frontend/package.json

      - name: Generate frontend assets
        run: go generate ./internal/static/

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          go build -ldflags "-s -w -X github.com/k1LoW/mo/version.Revision=$COMMIT" \
            -trimpath -o mo .

      - name: Package
        run: |
          ARCHIVE="mo_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip "${ARCHIVE}.zip" mo LICENSE
          else
            tar czf "${ARCHIVE}.tar.gz" mo LICENSE
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: mo_*.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#strubio-v}"
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          SHA_DARWIN_ARM64=$(sha256sum mo_${TAG}_darwin_arm64.zip | cut -d' ' -f1)
          SHA_DARWIN_AMD64=$(sha256sum mo_${TAG}_darwin_amd64.zip | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum mo_${TAG}_linux_arm64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(sha256sum mo_${TAG}_linux_amd64.tar.gz | cut -d' ' -f1)

          cat > /tmp/mo.rb << FORMULA
          class Mo < Formula
            desc "Markdown viewer that opens .md files in a browser"
            homepage "https://github.com/Rubio-Enterprises/mo"
            version "$VERSION"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "$BASE_URL/mo_${TAG}_darwin_arm64.zip"
                sha256 "$SHA_DARWIN_ARM64"
              end
              if Hardware::CPU.intel?
                url "$BASE_URL/mo_${TAG}_darwin_amd64.zip"
                sha256 "$SHA_DARWIN_AMD64"
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "$BASE_URL/mo_${TAG}_linux_arm64.tar.gz"
                sha256 "$SHA_LINUX_ARM64"
              end
              if Hardware::CPU.intel?
                url "$BASE_URL/mo_${TAG}_linux_amd64.tar.gz"
                sha256 "$SHA_LINUX_AMD64"
              end
            end

            def install
              bin.install "mo"
              generate_completions_from_executable(bin/"mo", "completion")
            end

            test do
              assert_match "mo version", shell_output("#{bin}/mo --version")
            end
          end
          FORMULA

          # Remove heredoc indentation
          sed -i 's/^          //' /tmp/mo.rb

          gh api repos/Rubio-Enterprises/homebrew-tap/contents/Formula/mo.rb \
            --method PUT \
            --field message="feat: bump mo to $TAG" \
            --field content="$(base64 -w0 /tmp/mo.rb)" \
            --field sha="$(gh api repos/Rubio-Enterprises/homebrew-tap/contents/Formula/mo.rb --jq '.sha')"
