# Fork release pipeline. Tags matching `v<X.Y.Z>-strubio.<N>` build the matrix,
# publish a GitHub release, and rewrite `Formula/mo.rb` in Rubio-Enterprises/
# homebrew-tap. `<X.Y.Z>` mirrors the upstream k1LoW/mo version this fork
# carries; `<N>` counts fork rebuilds on that same upstream version.
#
# The filename is a deliberate squat, NOT an oversight: upstream owns
# `.github/workflows/tagpr.yml`, and holding the path keeps upstream's
# tagpr + goreleaser pipeline from silently reappearing through an upstream
# sync merge. Nothing here runs tagpr. Renaming this file to `release.yml`
# would free the path for upstream's version to land as a plain addition on
# the next sync, where it would run on every push to main.
#
# The glob MUST stay `v*-strubio.*`. A bare `v*` would match the 44 upstream
# tags already on origin (`v0.1.0` … `v0.20.1`), each firing a full matrix
# build and a garbage tap write.
name: release

on:
  push:
    tags:
      - "v*-strubio.*"
  # Operator re-drive for an ALREADY PUBLISHED tag. The tap bump is the one step
  # that can fail for reasons unrelated to this repo (the tap's rulesets, a
  # GitHub incident, a mid-flight IaC apply), and when it does the release itself
  # is already published — so a plain re-run is not available: `gh release
  # create` would abort on the existing release before reaching the bump.
  # Dispatching with an existing tag skips verify/build/release entirely and
  # re-drives ONLY `bump-tap`, recomputing checksums from the published assets.
  # This is what recovered v1.6.7-strubio.1 after its tap write lost a 71-second
  # race with the rulesets/tap-push-App bypass apply (.github-private#192).
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to re-bump the tap formula for, e.g. v1.6.7-strubio.1"
        required: true
        type: string

jobs:
  verify:
    # The tag triggers the release, but `version/version.go` is the version
    # source of truth (upstream's shape, bumped by the release commit). Nothing
    # else makes the two agree, and a mismatch would ship a binary whose
    # `--version` contradicts its own tag and the Homebrew formula. Fail here,
    # before four matrix builds and a tap write.
    #
    # Tag-push only: on a dispatch re-drive the release already exists, so its
    # published assets — not this checkout — are the source of truth, and `main`
    # may legitimately have moved on to the next version by then.
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.RUNNER_GLUE || '["ubuntu-latest"]') }}
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match version/version.go
        run: |
          TAG="$GITHUB_REF_NAME"
          EXPECTED="${TAG#v}"
          DECLARED=$(sed -n 's/.*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' version/version.go)
          if [ "$DECLARED" != "$EXPECTED" ]; then
            echo "tag/version mismatch: tag $TAG implies $EXPECTED, but version/version.go declares $DECLARED" >&2
            echo "  fix: set Version to \"$EXPECTED\" in version/version.go, commit, delete the tag, re-tag" >&2
            exit 1
          fi
          echo "version/version.go declares $DECLARED, matching $TAG"

  build:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.RUNNER_GLUE || '["ubuntu-latest"]') }}
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            ext: zip
          - goos: darwin
            goarch: amd64
            ext: zip
          - goos: linux
            goarch: arm64
            ext: tar.gz
          - goos: linux
            goarch: amd64
            ext: tar.gz
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: internal/frontend/package.json

      - name: Generate frontend assets
        run: go generate ./internal/static/

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          go build -ldflags "-s -w -X github.com/k1LoW/mo/version.Revision=$COMMIT" \
            -trimpath -o mo .

      - name: Package
        run: |
          ARCHIVE="mo_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip "${ARCHIVE}.zip" mo LICENSE
          else
            tar czf "${ARCHIVE}.tar.gz" mo LICENSE
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: mo_*.${{ matrix.ext }}

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.RUNNER_GLUE || '["ubuntu-latest"]') }}
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      # Idempotent on purpose: a re-run of this job must not abort on the release
      # it published on its own previous attempt. Bare `gh release create` errors
      # when the release exists, which is precisely what made the
      # v1.6.7-strubio.1 tap failure unrecoverable by re-run.
      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists — re-uploading assets"
            gh release upload "$TAG" ./*.zip ./*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" ./*.zip ./*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi

  # A separate job on purpose. The tap write crosses a repository boundary and
  # can fail for reasons that have nothing to do with this build — the tap's
  # rulesets, a GitHub incident, an in-flight Terraform apply. Isolating it means
  # such a failure costs one job re-run (or a dispatch) instead of a burnt
  # version number, and deriving the checksums from the PUBLISHED assets rather
  # than the build workspace makes it correct standalone for any released tag.
  bump-tap:
    needs: release
    # After a successful release on a tag push, and on a dispatch re-drive where
    # verify/build/release are all skipped.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ${{ fromJSON(vars.RUNNER_GLUE || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    steps:
      - name: Resolve tag and fetch published assets
        id: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in
            v*-strubio.*) ;;
            *) echo "::error::refusing to bump the tap for '$TAG' — expected v<X.Y.Z>-strubio.<N>"; exit 1 ;;
          esac
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::no published release for $TAG — nothing for the tap to point at"
            exit 1
          fi
          mkdir -p dist
          cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'mo_*' --clobber
          missing=0
          for f in \
            "mo_${TAG}_darwin_arm64.zip" \
            "mo_${TAG}_darwin_amd64.zip" \
            "mo_${TAG}_linux_arm64.tar.gz" \
            "mo_${TAG}_linux_amd64.tar.gz"; do
            test -f "$f" || { echo "::error::release $TAG is missing asset $f"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "resolved $TAG with all four assets"

      # Per-run push credential: contents:write on the tap only, expires with the
      # job. Replaces the retired HOMEBREW_TAP_TOKEN PAT. This App holds an
      # `always` bypass on the tap's rulesets (declared in .github-private's
      # terraform), which is what lets the bump push straight to its default
      # branch instead of opening a PR.
      - name: Mint tap-push App token
        id: tap-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAP_PUSH_APP_ID }}
          private-key: ${{ secrets.TAP_PUSH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ steps.tap-app.outputs.token }}
          TAG: ${{ steps.assets.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          # Homebrew wants the version without the leading `v`, suffix intact:
          # `v1.6.7-strubio.1` -> `1.6.7-strubio.1`.
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          SHA_DARWIN_ARM64=$(sha256sum "mo_${TAG}_darwin_arm64.zip" | cut -d' ' -f1)
          SHA_DARWIN_AMD64=$(sha256sum "mo_${TAG}_darwin_amd64.zip" | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum "mo_${TAG}_linux_arm64.tar.gz" | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(sha256sum "mo_${TAG}_linux_amd64.tar.gz" | cut -d' ' -f1)

          cat > /tmp/mo.rb << FORMULA
          class Mo < Formula
            desc "Markdown viewer that opens .md files in a browser"
            homepage "https://github.com/Rubio-Enterprises/mo"
            version "$VERSION"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "$BASE_URL/mo_${TAG}_darwin_arm64.zip"
                sha256 "$SHA_DARWIN_ARM64"
              end
              if Hardware::CPU.intel?
                url "$BASE_URL/mo_${TAG}_darwin_amd64.zip"
                sha256 "$SHA_DARWIN_AMD64"
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "$BASE_URL/mo_${TAG}_linux_arm64.tar.gz"
                sha256 "$SHA_LINUX_ARM64"
              end
              if Hardware::CPU.intel?
                url "$BASE_URL/mo_${TAG}_linux_amd64.tar.gz"
                sha256 "$SHA_LINUX_AMD64"
              end
            end

            def install
              bin.install "mo"
              generate_completions_from_executable(bin/"mo", "completion")
            end

            test do
              assert_match "mo version", shell_output("#{bin}/mo --version")
            end
          end
          FORMULA

          # Remove heredoc indentation
          sed -i 's/^          //' /tmp/mo.rb

          gh api repos/Rubio-Enterprises/homebrew-tap/contents/Formula/mo.rb \
            --method PUT \
            --field message="feat: bump mo to $TAG" \
            --field content="$(base64 -w0 /tmp/mo.rb)" \
            --field sha="$(gh api repos/Rubio-Enterprises/homebrew-tap/contents/Formula/mo.rb --jq '.sha')"
